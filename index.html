<script>
  // CBO oficial do MTE: títulos e sinônimos para consulta offline.
  const cboOccupations = [{"code":"214535","names":["Tecnólogo em produção sulcroalcooleira","Tecnólogo em produção de açúcar e álcool"]},{"code":"424120","names":["Entrevistador de pre�..."]}];
(() => {
  // Responsive helpers: inject touch-friendly CSS and detect touch devices.
  (function injectResponsive(){
    try {
      const css = `
      /* Responsive layout: desktop and mobile adjustments */
      @media (min-width:900px){
        main.app{max-width:1100px;margin:18px auto;display:grid;grid-template-columns:320px 1fr;gap:20px;padding:0 18px}
        .site-footer{max-width:1100px;margin:0 auto}
        .card{margin:0}
      }
      @media (max-width:899px){
        html.touch button, html.touch input, html.touch select { touch-action: manipulation; }
        .card{padding:12px;border-radius:12px}
        .bot-input, .notes-area, .sheet-input { padding:14px }
        .task-actions .task-action{padding:10px 12px}
        .modal{width:calc(100% - 32px);max-width:640px;margin:0;border-radius:12px}
        .push-steps{grid-template-columns:1fr}
        .push-step .push-art{display:none}
        .top .brand{font-size:18px}
        .top-right{gap:8px}
      }
      /* touch-specific larger hit targets */
      html.touch .task .check, html.touch .task .task-action { padding:12px; min-height:44px; }
      html.touch .intro-submit, html.touch .reminder-button, html.touch .intro-games-button { padding:12px 16px; font-size:15px }
      `;
      const s = document.createElement('style'); s.id = 'injected-responsive-styles'; s.appendChild(document.createTextNode(css));
      document.head.appendChild(s);
      // add touch class if touch-capable device
      if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
        document.documentElement.classList.add('touch');
        document.body.classList.add('touch');
      }
    } catch (e) { /* fail silently */ }
  })();

  // -- rest of the original script starts here --
  let deferredInstallPrompt = null;
  const installButton = document.querySelector('#installApp');
  const installHint = document.querySelector('#installHint');
  window.addEventListener('beforeinstallprompt', event => {
    event.preventDefault();
    deferredInstallPrompt = event;
    if(installButton) installButton.hidden = false;
  });
  if(installButton) installButton.addEventListener('click', async () => {
    if (!deferredInstallPrompt) {
      if(installHint) installHint.textContent = location.protocol === 'file:'
        ? 'Para instalar, publique o TarefaMix em HTTPS. Depois use “Instalar app” no menu do Chrome ou Edge.'
        : 'Se o instalador não abrir, use o menu do navegador: “Instalar TarefaMix” ou “Adicionar à tela inicial”.';
      if(installHint) installHint.hidden = false;
      return;
    }
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    if(installButton) installButton.hidden = true;
    if(installHint) installHint.hidden = true;
  });
  window.addEventListener('appinstalled', () => { if(installButton) installButton.hidden = true; if(installHint) installHint.hidden = true; });

  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('./service-worker.js').catch(() => {});
  }

  // (The rest of the original large script continues unchanged...)
})();
</script>
</body>
</html>
