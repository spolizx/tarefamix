<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#347a58">
<title>Jogos de estudo — TarefaMix</title>
<style>
:root{color-scheme:light;--ink:#17221d;--muted:#6e7d73;--green:#347a58;--mint:#e7f2eb;--line:#e3eae4;--bg:#f5f8f5;--blue:#eaf1fb;--gold:#fff2ce}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}
/* Injected responsive rules for játék page */
@media (min-width:900px){
  main.wrap{max-width:1100px;margin:24px auto;display:grid;grid-template-columns:1fr 420px;gap:20px;padding:0 18px}
  .hero{grid-column:1/2}
}
@media (max-width:899px){
  html.touch button, html.touch input { touch-action: manipulation; }
  .hero{padding:12px}
  .controls button{padding:12px 14px;font-size:16px}
}
html.touch .answer, html.touch button { min-height:44px;padding:12px }
</style>
</head>
<body>
<main class="wrap"><header class="top"><a class="brand" href="../index.html">✳ TarefaMix</a><a class="back" href="../index.html">← Voltar ao organizador</a></header>
<section class="hero"><h1>Jogos de estudo</h1><p>Escolha um tema e responda algumas perguntas para praticar.</p>
<label for="topic">Tema<select id="topic"><option value="mixed">Misturado</option><option value="addition">Adição</option><option value="subtraction">Subtração</option><option value="multiplication">Multiplicação</option><option value="division">Divisão</option></select></label>
<button id="start" class="primary">Começar</button></section>
<section id="gameArea" hidden>
  <div id="question"></div>
  <div class="controls">
    <button class="answer">1</button>
    <button class="answer">2</button>
    <button class="answer">3</button>
    <button class="answer">4</button>
  </div>
  <div><button id="next">Próxima</button></div>
</section>
<section id="result" hidden>
  <h2>Resultado</h2>
  <div id="score"></div>
  <button id="playAgain">Jogar novamente</button>
</section>
<script>
(() => {
 // small original script kept - game logic
 const topicEl=document.querySelector('#topic'), startBtn=document.querySelector('#start'), gameArea=document.querySelector('#gameArea'), result=document.querySelector('#result'), questionEl=document.querySelector('#question'), nextBtn=document.querySelector('#next'), playAgain=document.querySelector('#playAgain');
 const answersEls = [...document.querySelectorAll('.answer')];
 const names={mixed:'MATEMÁTICA',addition:'ADIÇÃO',subtraction:'SUBTRAÇÃO',multiplication:'MULTIPLICAÇÃO',division:'DIVISÃO'};let questions=[],index=0,points=0,locked=false;
 const rand=(min,max)=>Math.floor(Math.random()*(max-min+1))+min;
 function makeQuestion(topic){let op=topic;if(op==='mixed')op=['addition','subtraction','multiplication','division'][rand(0,3)];let a,b,symbol,answer;if(op==='addition'){a=rand(1,50);b=rand(1,50);symbol='+';answer=a+b}else if(op==='subtraction'){a=rand(1,50);b=rand(1,50);symbol='−';answer=a-b}else if(op==='multiplication'){a=rand(1,12);b=rand(1,12);symbol='×';answer=a*b}else{a=rand(2,12);b=rand(2,12);symbol='÷';answer=Math.floor(a/b)};const choices=[answer,answer+rand(1,6),Math.max(0,answer-rand(1,4)),answer+rand(7,12)].sort(()=>Math.random()-0.5);return {text:`${a} ${symbol} ${b} = ?`,answer,choices};}
 function begin(){questions=Array.from({length:10},()=>makeQuestion(topicEl.value));index=0;points=0;locked=false;result.hidden=true;gameArea.hidden=false;startBtn.textContent='Recomeçar';render();}
 function render(){const q=questions[index];locked=false;nextBtn.hidden=true;questionEl.textContent=`Pergunta ${index+1}: ${q.text}`;answersEls.forEach((el,i)=>{el.disabled=false;el.textContent=q.choices[i];});}
 function choose(el){if(locked)return;locked=true;const val=Number(el.textContent);const correct=val===questions[index].answer;if(correct){points++;el.style.background='#cfead9'}else{el.style.background='#ffd6d6';answersEls.find(a=>Number(a.textContent)===questions[index].answer).style.outline='2px solid #347a58'}nextBtn.hidden=false;}
 function finish(){gameArea.hidden=true;result.hidden=false;document.querySelector('#score').textContent=`Você acertou ${points} de ${questions.length}`;}
 startBtn.addEventListener('click',begin);nextBtn.addEventListener('click',()=>{if(!locked)return;if(index===questions.length-1){finish();return}index++;render();});playAgain.addEventListener('click',begin);answersEls.forEach(el=>el.addEventListener('click',()=>choose(el)));
 // detect touch and add class for larger hit targets
 if('ontouchstart' in window||navigator.maxTouchPoints>0){document.documentElement.classList.add('touch');}
})();
</script>
</body>
</html>
